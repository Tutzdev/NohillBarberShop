[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nohill-club-backend"
version = "0.1.0"
description = "Backend modular da Nohill Club"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "Flask-JWT-Extended>=4.7,<5",
  "Flask-Limiter>=3.12,<5",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "gunicorn>=23,<24",
  "marshmallow>=3.23,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
